name: Deploy to cPanel (siakad.mts)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip, gd

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Frontend
        run: |
          npm ci
          npm run build
          tar -czf build.tar.gz public/build

      - name: 1. Deploy Backend (Clone / Pull Repository)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: masnomod
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 64000
          script: |
            set -e
            APP_DIR="public_html/siakad.mts"
            REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            mkdir -p ~/$APP_DIR
            cd ~/$APP_DIR

            if [ ! -d ".git" ]; then
              echo "Initializing Git Repository on cPanel..."
              git clone --branch main $REPO .
            else
              echo "Pulling latest changes on cPanel..."
              git remote set-url origin $REPO
              git fetch origin main
              git reset --hard origin/main
            fi

            # Install vendor dependencies on cPanel
            composer install --no-dev --optimize-autoloader --no-interaction

      - name: 2. Upload Frontend Artifacts (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: masnomod
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 64000
          source: "build.tar.gz"
          target: "public_html/siakad.mts/"

      - name: 3. Finalize Deployment & Optimize Laravel
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: masnomod
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 64000
          script: |
            set -e
            APP_DIR="public_html/siakad.mts"
            cd ~/$APP_DIR

            # Extract Frontend Assets
            tar -xzf build.tar.gz
            rm -f build.tar.gz

            # Laravel Optimization & Migrations
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            php artisan migrate --force || true

            echo "✅ Deployment ke public_html/siakad.mts Berhasil!"
