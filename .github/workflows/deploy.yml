name: Deploy to cPanel (siakad.mts)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip, gd

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH Keys
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Create askpass script to feed passphrase to ssh-add non-interactively
          printf '#!/bin/bash\necho "$SSH_PASSPHRASE"\n' > /tmp/askpass.sh
          chmod 755 /tmp/askpass.sh

          export SSH_ASKPASS=/tmp/askpass.sh
          export DISPLAY=dummy:0
          export SSH_ASKPASS_REQUIRE=force

          eval $(ssh-agent -s)
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -

          # Persist ssh-agent environment for subsequent steps
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Deploy Exclusively to public_html/siakad.mts
        env:
          REMOTE_HOST: "202.155.137.33"
          REMOTE_USER: ${{ secrets.SSH_USER || 'masnomod' }}
          CUSTOM_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Resolve host to show IP diagnostics
          RESOLVED_IP=$(getent hosts "$REMOTE_HOST" | awk '{print $1}' | head -n 1)
          echo "Host $REMOTE_HOST resolves to IP: $RESOLVED_IP"

          # Auto-detect responsive SSH port across common hosting ports
          TARGET_PORT=""
          if [ -n "$CUSTOM_PORT" ]; then
            TARGET_PORT="$CUSTOM_PORT"
            echo "Using configured SSH_PORT: $TARGET_PORT"
          else
            echo "Searching for active SSH port on server ($RESOLVED_IP)..."
            for p in 22 2222 65002 2200 1022; do
              if timeout 3 bash -c "</dev/tcp/$REMOTE_HOST/$p" 2>/dev/null; then
                echo "=> Active port detected: $p"
                TARGET_PORT="$p"
                break
              fi
            done
          fi

          if [ -z "$TARGET_PORT" ]; then
            echo "No custom port open, falling back to port 22..."
            TARGET_PORT="22"
          fi

          echo "Initiating deployment to $REMOTE_HOST on port $TARGET_PORT as $REMOTE_USER..."

          # Rsync STRICTLY to /home/masnomod/public_html/siakad.mts/
          rsync -avz -e "ssh -4 -p $TARGET_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            ./ ${REMOTE_USER}@${REMOTE_HOST}:/home/masnomod/public_html/siakad.mts/

          # Execute Laravel optimization strictly in siakad.mts directory
          ssh -4 -p $TARGET_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 ${REMOTE_USER}@${REMOTE_HOST} "
            cd /home/masnomod/public_html/siakad.mts &&
            php artisan migrate --force || true &&
            php artisan storage:link || true &&
            php artisan optimize:clear &&
            php artisan config:cache || true &&
            php artisan route:cache || true &&
            php artisan view:cache || true
          "
