name: Deploy to cPanel (siakad.mts)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip, gd

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH Keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Exclusively to public_html/siakad.mts
        env:
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER || 'masnomod' }}
          CUSTOM_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Auto-detect responsive SSH Port (specified port, 22, or 2222)
          PORT="22"
          if [ -n "$CUSTOM_PORT" ]; then
            PORT="$CUSTOM_PORT"
          elif nc -z -v -w5 "$REMOTE_HOST" 22 2>/dev/null; then
            PORT="22"
          elif nc -z -v -w5 "$REMOTE_HOST" 2222 2>/dev/null; then
            PORT="2222"
          fi
          echo "Connecting to $REMOTE_HOST on port $PORT as $REMOTE_USER..."

          # Rsync STRICTLY to /home/masnomod/public_html/siakad.mts/
          rsync -avz -e "ssh -4 -p $PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            ./ ${REMOTE_USER}@${REMOTE_HOST}:/home/masnomod/public_html/siakad.mts/

          # Execute Laravel optimization strictly in siakad.mts directory
          ssh -4 -p $PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${REMOTE_USER}@${REMOTE_HOST} << 'EOF'
            cd /home/masnomod/public_html/siakad.mts
            php artisan migrate --force || true
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
          EOF
